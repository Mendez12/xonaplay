<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XonaPlay Player</title>
<style>html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden}#player{width:100%;height:100vh;border:0}</style>
</head>
<body>
<iframe id="player" allowfullscreen allow="autoplay; fullscreen"></iframe>
<script>
function getParam(name){
  const url = window.location.href;
  const regex = new RegExp('[?&]'+name+'=([^&]+)');
  const m = url.match(regex);
  return m ? decodeURIComponent(m[1]) : null;
}
let s1 = getParam('s1');
if(s1){
  // Decodifica si viene en base64 o normal
  try{ if(s1.length>100 && !s1.includes('http')) s1=atob(s1); }catch(e){}
  s1 = s1.replace(/^\s+/, '');
  console.log("Cargando:", s1);
  document.getElementById('player').src = s1;
} else {
  document.body.innerHTML = '<div style="color:white;text-align:center;padding-top:50px">Falta parametro s1</div>';
}
</script>
</body>
</html>
