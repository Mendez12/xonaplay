<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XonaPlay Player</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center}#playerWrap{position:relative;width:100%;height:100%;background:#000}video,iframe{width:100%;height:100%;border:0;display:block;background:#000}.overlay{position:absolute;z-index:10;pointer-events:none}.top-left{top:12px;left:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800}.bottom-right{bottom:12px;right:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);color:#fff;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:700} #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7c3aed;gap:12px;background:#000;z-index:5}.spinner{width:40px;height:40px;border:3px solid #1a1a33;border-top:3px solid #7c3aed;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div id="playerWrap"><div id="loading"><div class="spinner"></div><div style="color:#5a5a7a;font-size:12px">Cargando XonaPlay...</div></div><div class="overlay top-left" id="titleBadge">XONAPLAY</div><div class="overlay bottom-right">XONAPLAY</div></div><script>function getParam(n){return new URLSearchParams(window.location.search).get(n)||''}let s1=getParam('s1'),s2=getParam('s2'),titulo=getParam('titulo'),poster=getParam('poster');let wrap=document.getElementById('playerWrap');let loading=document.getElementById('loading');document.getElementById('titleBadge').textContent=titulo?titulo.substring(0,35):'XONAPLAY';function isEmbedUrl(url){let embeds=['vimeus.com','mixdrop','filemoon','streamtape','voe.sx','doodstream','uqload','vidhide','filelions'];return embeds.some(d=>url.toLowerCase().includes(d));}function load(){if(!s1){loading.innerHTML='<div style="color:#f87171">Sin link de video</div>';return;}if(isEmbedUrl(s1)){loading.style.display='none';let ifr=document.createElement('iframe');ifr.src=s1;ifr.allowFullscreen=true;ifr.allow='autoplay; encrypted-media; fullscreen';wrap.appendChild(ifr);return;}loading.style.display='none';let video=document.createElement('video');video.controls=true;video.autoplay=true;video.playsInline=true;video.poster=poster||'';video.style.background='#000';wrap.appendChild(video);if(s1.includes('.m3u8')){if(Hls.isSupported()){let hls=new Hls();hls.loadSource(s1);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=s1;}}else{video.src=s1;video.play().catch(()=>{});}video.addEventListener('error',()=>{if(s2&&video.src!==s2){video.src=s2;}});} }setTimeout(load,400);</script></body></html>
