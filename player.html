<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XonaPlay V10.1 Skip 10s</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Plus Jakarta Sans',Arial}
#wrap{position:relative;width:100%;height:100vh;background:#000;overflow:hidden;cursor:none}
#wrap.show{cursor:default}
#bgPoster{position:absolute;inset:0;z-index:1;background-size:cover;background-position:center;filter:blur(32px) brightness(.32);transform:scale(1.12);transition:.8s}
#bgGradient{position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,#000 18%,rgba(0,0,0,.65) 38%,transparent 68%,rgba(0,0,0,.7) 100%)}
#topBar{position:absolute;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);transition:.4s}
#topBar.hide{transform:translateY(-110%);opacity:0}
.logo{font-weight:800;font-size:17px;color:#fff;text-transform:uppercase;display:flex;gap:7px}
.logo span{color:#7c3aed}
#titleTxt{color:#fff;font-size:13px;font-weight:700;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subTxt{color:#aaa;font-size:10px;font-weight:600}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60;text-align:center;transition:.35s}
#center.hide{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.88)}
#bigPlay{width:90px;height:90px;background:#7c3aed;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 40px rgba(124,58,237,.75);cursor:pointer}
#centerTitle{color:#fff;font-size:23px;font-weight:800;max-width:540px;text-shadow:0 4px 24px rgba(0,0,0,.9)}
#centerSub{color:rgba(255,255,255,.65);font-size:11px;margin-top:8px;font-weight:700}
#modeBadge{position:absolute;top:64px;left:20px;z-index:90;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.4);color:#a78bfa;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:800}
#skipControls{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:65;display:none;align-items:center;gap:40px;transition:.3s}
#skipControls.show{display:flex}
.skipBtn{width:64px;height:64px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);transition:.2s}
.skipBtn:hover{background:rgba(255,255,255,.22);transform:scale(1.08)}
.skipBtn svg{width:28px;height:28px;fill:#fff}
.skipBtn small{position:absolute;bottom:-20px;color:#fff;font-size:10px;font-weight:800;letter-spacing:1px}
#playPauseCenter{width:78px;height:78px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
#playPauseCenter:hover{background:rgba(255,255,255,.26);transform:scale(1.05)}
#playPauseCenter svg{width:32px;height:32px;fill:#fff}
#player,#video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:10}
#video{display:none}
#bottom{position:absolute;bottom:0;left:0;right:0;z-index:95;padding:0 20px 14px 20px;background:linear-gradient(0deg,rgba(0,0,0,.98) 0%,rgba(0,0,0,.75) 55%,transparent 100%);transition:.4s}
#bottom.hide{transform:translateY(110%);opacity:0}
#progWrap{width:100%;height:20px;display:flex;align-items:center;cursor:pointer;position:relative}
#progBg{width:100%;height:4px;background:rgba(255,255,255,.3);border-radius:99px;transition:.22s}
#progFill{height:100%;width:0%;background:#7c3aed;border-radius:99px}
#previewTip{position:absolute;bottom:36px;transform:translateX(-50%);background:#14141f;border:1px solid #2a2a4a;padding:6px 8px;border-radius:10px;display:none;pointer-events:none;z-index:99}
#previewBox{width:140px;height:78px;background:#000;border-radius:6px;background-size:cover;background-position:center;margin-bottom:4px}
#previewTip b{color:#fff;font-size:11px;display:block;text-align:center}
#ctrlRow{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.cLeft,.cRight{display:flex;align-items:center;gap:10px}
.cBtn{background:transparent;border:0;color:#fff;cursor:pointer;opacity:.92;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.cBtn:hover{background:rgba(255,255,255,.12)}
.cBtn svg{width:20px;height:20px;fill:#fff}
#time{color:#e8e8e8;font-size:11px;font-weight:600;min-width:108px}
#marcaPill{color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(124,58,237,.12));border:1px solid rgba(124,58,237,.38);padding:5px 12px;border-radius:20px}
#epiBtn{display:none}
#epiBtn.show{display:flex}
#epiDrawer{position:absolute;top:0;right:0;bottom:0;width:340px;z-index:110;background:#0f0f17;border-left:1px solid #23233a;transform:translateX(100%);transition:.35s;display:flex;flex-direction:column}
#epiDrawer.show{transform:translateX(0)}
#epiHead{padding:16px 18px;border-bottom:1px solid #23233a;display:flex;justify-content:space-between;align-items:center}
#epiHead b{color:#fff;font-size:13px}
#epiList{overflow-y:auto;flex:1;padding:8px}
.epiItem{padding:10px 12px;border-radius:10px;display:flex;gap:10px;cursor:pointer;margin-bottom:4px}
.epiItem:hover{background:#1a1a2a}
.epiItem.active{background:#7c3aed}
.epiNum{width:28px;height:28px;background:#22223a;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;font-weight:800}
.epiItem.active .epiNum{background:rgba(255,255,255,.2);color:#fff}
.epiInfo b{color:#fff;font-size:12px;display:block;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epiInfo small{color:#888;font-size:10px}
#nextOverlay,#resumeOverlay{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column}
#nextOverlay.show,#resumeOverlay.show{display:flex}
#nextOverlay b,#resumeOverlay b{color:#fff;font-size:22px;margin-bottom:6px;text-align:center;padding:0 20px}
#nextOverlay p,#resumeOverlay p{color:#aaa;font-size:13px;text-align:center}
#nextBar{width:220px;height:4px;background:rgba(255,255,255,.2);border-radius:10px;margin-top:16px;overflow:hidden}
#nextFill{height:100%;width:0%;background:#7c3aed;transition:width 1s linear}
#serverMenu{position:absolute;bottom:64px;right:20px;z-index:98;background:#14141f;border:1px solid #2a2a4a;border-radius:14px;padding:8px;min-width:220px;box-shadow:0 12px 32px rgba(0,0,0,.6);display:none;max-height:420px;overflow:auto}
#serverMenu.show{display:block}
.qOpt{width:100%;text-align:left;background:transparent;border:0;color:#a5a5c5;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between}
.qOpt:hover{background:#1f1f35;color:#fff}
.qOpt.active{background:#7c3aed;color:#fff}
.menuTitle{color:#666;font-size:9px;font-weight:800;letter-spacing:1px;padding:10px 12px 4px 12px;border-top:1px solid #1e1e3a;margin-top:6px}
.menuTitle:first-child{border-top:0;margin-top:0}
#loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:70;display:none}
.spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,.12);border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="wrap" class="show">
 <div id="bgPoster"></div><div id="bgGradient"></div>
 <div id="topBar"><div style="display:flex;gap:14px;align-items:center"><div class="logo">▶ <span id="logoSpan">XONAPLAY</span></div><div><b id="titleTxt"></b><div id="subTxt"></div></div></div></div>
 <div id="modeBadge"></div>
 <div id="center"><div id="bigPlay" onclick="start()"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M8 5.14v14l11-7-11-7z"/></svg></div><div id="centerTitle"></div><div id="centerSub"></div></div>
 <div id="skipControls">
  <div style="position:relative"><div class="skipBtn" onclick="seekBy(-10)"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="8" y="16" font-size="6" fill="white" font-weight="800">10</text></svg></div><small>10</small></div>
  <div id="playPauseCenter" onclick="toggle()"><svg id="ppCenterIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></div>
  <div style="position:relative"><div class="skipBtn" onclick="seekBy(10)"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6h2c0-4.42-3.58-8-8-8s-8 3.58-8 8 3.58 8 8 8z"/><text x="10" y="16" font-size="6" fill="white" font-weight="800">10</text></svg></div><small>10</small></div>
 </div>
 <iframe id="player" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
 <video id="video"></video>
 <div id="previewTip"><div id="previewBox"></div><b id="previewTime">00:00</b></div>
 <div id="epiDrawer"><div id="epiHead"><b id="epiHeadTitle">Episodios</b><button class="cBtn" onclick="document.getElementById('epiDrawer').classList.remove('show')">✕</button></div><div id="epiList"></div></div>
 <div id="resumeOverlay"><b>¿Continuar viendo?</b><p id="resumeDesc"></p><div style="display:flex;gap:10px;margin-top:16px"><button onclick="resumeYes()" style="background:#7c3aed;border:0;color:#fff;padding:10px 22px;border-radius:20px;cursor:pointer;font-weight:800">SÍ, CONTINUAR</button><button onclick="resumeNo()" style="background:rgba(255,255,255,.12);border:0;color:#fff;padding:10px 22px;border-radius:20px;cursor:pointer">EMPEZAR DE CERO</button></div></div>
 <div id="nextOverlay"><b>Siguiente episodio en <span id="count">5</span>s</b><p id="nextName"></p><div id="nextBar"><div id="nextFill"></div></div><div style="display:flex;gap:10px;margin-top:16px"><button onclick="playNextNow()" style="background:#7c3aed;border:0;color:#fff;padding:8px 18px;border-radius:20px;cursor:pointer;font-weight:800">REPRODUCIR YA</button><button onclick="cancelNext()" style="background:rgba(255,255,255,.12);border:0;color:#fff;padding:8px 18px;border-radius:20px;cursor:pointer">CANCELAR</button></div></div>
 <div id="serverMenu"></div>
 <div id="bottom" class="hide">
  <div id="progWrap"><div id="progBg"><div id="progFill"></div></div></div>
  <div id="ctrlRow">
   <div class="cLeft">
    <button class="cBtn" id="ppBtn" onclick="toggle()"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></button>
    <button class="cBtn" onclick="video.muted=!video.muted"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg></button>
    <span id="time">00:00 / 00:00</span>
    <button class="cBtn" id="epiBtn" onclick="toggleEpi()"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
   </div>
   <div class="cRight">
    <button class="cBtn" onclick="togglePiP()" title="PiP"><svg viewBox="0 0 24 24"><path d="M19 7H9v10h10V7zM21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg></button>
    <button class="cBtn" onclick="toggleCast()" title="TV"><svg viewBox="0 0 24 24"><path d="M1 18v3c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-3c0-.55-.45-1-1-1H2c-.55 0-1 .45-1 1zm0-5v3c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-3c0-.55-.45-1-1-1H2c-.55 0-1 .45-1 1zm0-5v3c0 .55.45 1 1 1h1c.55 0 1-.45 1-1V8c0-.55-.45-1-1-1H2c-.55 0-1 .45-1 1zm4.5 9.5c0 .55.45 1 1 1H21c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1H6.5c-.55 0-1 .45-1 1v12.5z"/></svg></button>
    <span id="marcaPill"></span>
    <button class="cBtn" onclick="toggleMenu()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><circle cx="19.5" cy="12" r="1.6"/><circle cx="4.5" cy="12" r="1.6"/></svg></button>
    <button class="cBtn" onclick="toggleFS()"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
   </div>
  </div>
 </div>
 <div id="loader"><div class="spinner"></div></div>
</div>
<script>
function g(n){let m=location.href.match(new RegExp('[?&]'+n+'=([^&]+)'));if(!m)return null;let v=decodeURIComponent(m[1]);try{if(v.length>60&&!v.includes('http'))v=atob(v)}catch(e){}try{v=decodeURIComponent(v)}catch(e){}return v}
function fromBase64Unicode(b64){try{return decodeURIComponent(escape(atob(b64)))}catch(e){return atob(b64)}}
let servers=[];['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10'].forEach(k=>{let v=g(k);if(v)servers.push(v)})
let titulo=g('titulo')||'',poster=g('poster'),year=g('year')||'2015',marca=(g('marca')||'XONAPLAY').toUpperCase(),t=g('t'),e=g('e'),tipo=g('tipo'),epsRaw=g('eps')
let decTitle=decodeURIComponent(titulo||'')
let isSeries=false
if(tipo&&tipo.toLowerCase().includes('serie'))isSeries=true
if(epsRaw)isSeries=true
if(t&&e)isSeries=true
document.getElementById('titleTxt').innerText=decTitle
document.getElementById('centerTitle').innerText=decTitle
document.getElementById('logoSpan').innerText=marca
document.getElementById('marcaPill').innerText=marca
document.getElementById('centerSub').innerText='Toca para reproducir • '+marca
document.getElementById('modeBadge').innerText=isSeries?'MODO SERIE':'MODO PELÍCULA'
if(isSeries)document.getElementById('epiBtn').classList.add('show')
if(t&&e)document.getElementById('subTxt').innerText=`T${t} • E${e} • ${year}`;else document.getElementById('subTxt').innerText=year+' • HD'
if(poster){try{let p=decodeURIComponent(poster);if(p.startsWith('http')){document.getElementById('bgPoster').style.backgroundImage=`url('${p}')`;document.getElementById('previewBox').style.backgroundImage=`url('${p}')`}}catch(e){}}
const topBar=document.getElementById('topBar'),bottom=document.getElementById('bottom'),iframe=document.getElementById('player'),video=document.getElementById('video'),center=document.getElementById('center'),loader=document.getElementById('loader'),progFill=document.getElementById('progFill'),timeEl=document.getElementById('time'),ppBtn=document.getElementById('ppBtn'),wrap=document.getElementById('wrap'),skipControls=document.getElementById('skipControls'),ppCenterIcon=document.getElementById('ppCenterIcon'),serverMenu=document.getElementById('serverMenu'),progWrap=document.getElementById('progWrap'),previewTip=document.getElementById('previewTip'),previewTime=document.getElementById('previewTime'),epiDrawer=document.getElementById('epiDrawer'),epiList=document.getElementById('epiList'),nextOverlay=document.getElementById('nextOverlay'),resumeOverlay=document.getElementById('resumeOverlay')
let hls=null,cur=0,started=false,hideT=null,ccOn=false,countInt=null,currentQuality=-1,pendingTime=0,resumeKey='',resumeTime=0
let episodes=[]
try{if(epsRaw){let jsonStr=fromBase64Unicode(epsRaw);episodes=JSON.parse(jsonStr)}}catch(e){try{episodes=JSON.parse(atob(epsRaw))}catch(e2){episodes=[]}}
if(isSeries && episodes.length===0 && servers.length>1){episodes=servers.map((u,i)=>({n:i+1,t:`Episodio ${i+1}`,url:u,d:'24 min'}))}
function isMedia(u){return u.toLowerCase().includes('.m3u8')||u.toLowerCase().includes('.mp4')||u.toLowerCase().includes('.webm')}
function getResumeKey(url){return 'xona_resume_'+btoa(url).slice(0,40)+'_'+btoa(decTitle).slice(0,20)}
function showLoad(b){loader.style.display=b?'block':'none'}
function play(url){
 showLoad(true);if(hls){try{hls.destroy()}catch(e){}} hls=null;currentQuality=-1
 center.classList.add('hide');document.getElementById('bgPoster').style.opacity='0';document.getElementById('bgGradient').style.opacity='0'
 bottom.classList.remove('hide')
 resumeKey=getResumeKey(url);resumeTime=parseFloat(localStorage.getItem(resumeKey)||0)
 if(resumeTime>15 && !isNaN(resumeTime)){document.getElementById('resumeDesc').innerText=`Te quedaste en ${fmt(resumeTime)} - ¿Quieres continuar?`;resumeOverlay.classList.add('show');pendingTime=resumeTime}else{pendingTime=0}
 if(isMedia(url)){
  iframe.style.display='none';video.style.display='block'
  if(url.toLowerCase().includes('.m3u8')&&Hls.isSupported()){
   hls=new Hls({autoStartLoad:true, capLevelToPlayerSize:false});
   hls.loadSource(url);hls.attachMedia(video);
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{showLoad(false);if(pendingTime==0)video.play();});
   hls.on(Hls.Events.LEVEL_SWITCHED,(ev,d)=>{currentQuality=d.level;})
  }else{video.src=url;video.oncanplay=()=>{showLoad(false);if(pendingTime==0)video.play();}}
 }else{video.pause();video.style.display='none';iframe.style.display='block';iframe.src=url;setTimeout(()=>showLoad(false),1000)}
}
function fmt(s){let m=Math.floor(s/60).toString().padStart(2,'0'),sc=Math.floor(s%60).toString().padStart(2,'0');return `${m}:${sc}`}
function resumeYes(){resumeOverlay.classList.remove('show');if(pendingTime){video.currentTime=pendingTime;video.play()} pendingTime=0}
function resumeNo(){resumeOverlay.classList.remove('show');localStorage.removeItem(resumeKey);pendingTime=0;video.currentTime=0;video.play()}
function start(){if(!servers.length && !episodes.length)return;started=true;let u=episodes.length?episodes[cur].url:servers[cur];play(u);ui();if(isSeries)buildEpiList()}
function seekBy(d){if(video.duration){video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+d));ui()}}
function toggle(){if(video.style.display==='block'){if(video.paused)video.play();else video.pause()}}
function toggleFS(){if(!document.fullscreenElement)wrap.requestFullscreen();else document.exitFullscreen()}
async function togglePiP(){try{if(document.pictureInPictureElement){await document.exitPictureInPicture()}else{if(video.readyState>0)await video.requestPictureInPicture()}}catch(e){}}
async function toggleCast(){try{if(video.remote){await video.remote.prompt()}else{alert('Chromecast: misma WiFi para TV y celular')}}catch(e){}}
function toggleSpeed(s){video.playbackRate=s;serverMenu.classList.remove('show')}
function setQuality(h){
 if(!hls)return
 if(h==='auto'){hls.currentLevel=-1;currentQuality=-1;serverMenu.classList.remove('show');return}
 let best=-1,bestH=0;for(let i=0;i<hls.levels.length;i++){let hh=hls.levels[i].height||0;if(hh<=h && hh>bestH){bestH=hh;best=i}}
 if(best==-1){let closest=0,min=9999;for(let i=0;i<hls.levels.length;i++){let d=Math.abs((hls.levels[i].height||0)-h);if(d<min){min=d;closest=i}}best=closest}
 hls.currentLevel=best;currentQuality=best;serverMenu.classList.remove('show')
}
function toggleMenu(){
 if(serverMenu.classList.contains('show')){serverMenu.classList.remove('show');return}
 let html=''
 if(hls && hls.levels && hls.levels.length>0){
  let levels=[...hls.levels].sort((a,b)=>b.height-a.height);let uniq=[...new Set(levels.map(l=>l.height))].sort((a,b)=>b-a)
  html+='<div class="menuTitle">CALIDAD REAL</div>'
  html+=`<button class="qOpt ${currentQuality==-1?'active':''}" onclick="setQuality('auto')"><span>Auto</span><span>${currentQuality==-1?'●':''}</span></button>`
  uniq.forEach(hh=>{let active=hls.levels[currentQuality]?.height==hh;html+=`<button class="qOpt ${active?'active':''}" onclick="setQuality(${hh})"><span>${hh}p</span><span>${active?'●':''}</span></button>`})
 }
 html+='<div class="menuTitle">VELOCIDAD</div>';[0.5,0.75,1,1.25,1.5,1.75,2].forEach(sp=>{let act=video.playbackRate==sp;html+=`<button class="qOpt ${act?'active':''}" onclick="toggleSpeed(${sp})"><span>${sp}x</span><span>${act?'●':''}</span></button>`})
 serverMenu.innerHTML=html;serverMenu.classList.add('show')
}
function toggleEpi(){epiDrawer.classList.toggle('show')}
function seek(ev){if(!video.duration)return;let r=ev.currentTarget.getBoundingClientRect();let p=(ev.clientX-r.left)/r.width;video.currentTime=p*video.duration}
progWrap.addEventListener('click',seek)
progWrap.addEventListener('mousemove',(e)=>{
 if(!video.duration)return;let r=progWrap.getBoundingClientRect();let p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));let t2=p*video.duration
 let m=Math.floor(t2/60).toString().padStart(2,'0'),s=Math.floor(t2%60).toString().padStart(2,'0')
 previewTime.innerText=`${m}:${s}`;previewTip.style.left=e.clientX+'px';previewTip.style.display='block'
})
progWrap.addEventListener('mouseleave',()=>{previewTip.style.display='none'})
video.addEventListener('timeupdate',()=>{
 if(!video.duration)return
 let pc=(video.currentTime/video.duration)*100;progFill.style.width=pc+'%'
 let cm=Math.floor(video.currentTime/60).toString().padStart(2,'0'),cs=Math.floor(video.currentTime%60).toString().padStart(2,'0'),dm=Math.floor(video.duration/60).toString().padStart(2,'0'),ds=Math.floor(video.duration%60).toString().padStart(2,'0')
 timeEl.innerText=`${cm}:${cs} / ${dm}:${ds}`
 if(video.currentTime>10 && video.currentTime < video.duration-20 && Math.floor(video.currentTime)%5==0){if(resumeKey) localStorage.setItem(resumeKey, video.currentTime)}
})
video.addEventListener('play',()=>{
 ppBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
 ppCenterIcon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
 skipControls.classList.remove('show')
 ui()
})
video.addEventListener('pause',()=>{
 ppBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>'
 ppCenterIcon.innerHTML='<path d="M8 5.14v14l11-7-11-7z"/>'
 skipControls.classList.add('show')
 ui()
})
video.addEventListener('ended',()=>{if(resumeKey)localStorage.removeItem(resumeKey);if(isSeries)autoNext()})
function buildEpiList(){
 epiList.innerHTML=''
 episodes.forEach((ep,idx)=>{
  let div=document.createElement('div');div.className='epiItem'+(idx==cur?' active':'')
  div.innerHTML=`<div class="epiNum">${ep.n}</div><div class="epiInfo"><b>${ep.t}</b><small>${ep.d||'24 min'}</small></div>`
  div.onclick=()=>{cur=idx;play(ep.url);document.querySelectorAll('.epiItem').forEach(x=>x.classList.remove('active'));div.classList.add('active');epiDrawer.classList.remove('show')}
  epiList.appendChild(div)
 })
}
function autoNext(){
 if(cur>=episodes.length-1 && cur>=servers.length-1)return
 nextOverlay.classList.add('show')
 let nextEpObj=episodes[cur+1]||{t:`Episodio ${cur+2}`}
 document.getElementById('nextName').innerText=nextEpObj.t
 let c=5;document.getElementById('count').innerText=c;document.getElementById('nextFill').style.width='0%'
 countInt=setInterval(()=>{c--;document.getElementById('count').innerText=c;document.getElementById('nextFill').style.width=((5-c)/5*100)+'%';if(c<=0){playNextNow()}},1000)
}
function playNextNow(){clearInterval(countInt);nextOverlay.classList.remove('show');cur++;let u=episodes.length?episodes[cur]?.url:servers[cur];if(u)play(u);buildEpiList()}
function cancelNext(){clearInterval(countInt);nextOverlay.classList.remove('show')}
function ui(){wrap.classList.add('show');topBar.classList.remove('hide');bottom.classList.remove('hide');if(started){if(!video.paused){skipControls.classList.remove('show')}else{skipControls.classList.add('show')}}clearTimeout(hideT);if(started&&!video.paused){hideT=setTimeout(()=>{topBar.classList.add('hide');bottom.classList.add('hide');wrap.classList.remove('show');serverMenu.classList.remove('show');skipControls.classList.remove('show')},3500)}}
wrap.addEventListener('mousemove',ui);wrap.addEventListener('click',(e)=>{if(e.target.closest('.skipBtn')||e.target.closest('#playPauseCenter'))return;ui()})
</script>
</body>
</html>
