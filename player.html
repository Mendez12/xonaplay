<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Plus Jakarta Sans',Arial;touch-action:manipulation}
#wrap{position:relative;width:100%;height:100dvh;background:#000;overflow:hidden;cursor:none;-webkit-tap-highlight-color:transparent}
#wrap.show{cursor:default}
#wrap.locked #topBar,#wrap.locked #bottom,#wrap.locked #skipControls,#wrap.locked #modeBadge{opacity:0!important;pointer-events:none!important}
#bgPoster{position:absolute;inset:0;z-index:1;background-size:cover;background-position:center;filter:blur(32px) brightness(.32);transform:scale(1.12)}
#bgGradient{position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,#000 18%,rgba(0,0,0,.65) 38%,transparent 68%,rgba(0,0,0,.7) 100%)}
#topBar{position:absolute;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);transition:.4s}

.logo{font-weight:800;font-size:17px;color:#fff;text-transform:uppercase;display:flex;gap:7px}
.logo span{color:#7c3aed}
#titleTxt{color:#fff;font-size:13px;font-weight:700;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subTxt{color:#aaa;font-size:10px;font-weight:600}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60;text-align:center;transition:.35s}
#center.hide{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.88)}
#bigPlay{width:90px;height:90px;background:#7c3aed;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 40px rgba(124,58,237,.75);cursor:pointer}
#centerTitle{color:#fff;font-size:23px;font-weight:800;max-width:540px;text-shadow:0 4px 24px rgba(0,0,0,.9)}
#centerSub{color:rgba(255,255,255,.65);font-size:11px;margin-top:8px;font-weight:700}
#modeBadge{position:absolute;top:64px;left:20px;z-index:90;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.4);color:#a78bfa;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:800}
#skipControls{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:65;display:none;align-items:center;gap:56px;transition:.3s}
#skipControls.show{display:flex}
.skipWrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.skipBtn{width:72px;height:72px;background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(12px);transition:.2s}
.skipBtn svg{width:30px;height:30px;fill:#fff}
.skipLabel{color:#fff;font-size:12px;font-weight:800;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:10px}
#playPauseCenter{width:84px;height:84px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.28);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(14px)}
#playPauseCenter svg{width:36px;height:36px;fill:#fff}
#player,#video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:10;object-fit:contain}
#video{display:none}
#seekFeedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:66;display:none;pointer-events:none}
#seekFeedback.show{display:flex;gap:60px;animation:pop .35s ease}
.seekAnim{width:88px;height:88px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seekAnim svg{width:28px;height:28px;fill:#fff}
.seekAnim b{color:#fff;font-size:13px;margin-top:2px;font-weight:800}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#bottom{position:absolute;bottom:0;left:0;right:0;z-index:95;padding:10px 14px 20px 14px;background:linear-gradient(0deg,rgba(0,0,0,.98) 0%,rgba(0,0,0,.85) 65%,transparent 100%);transition:.4s;min-height:68px}

#progWrap{width:100%;height:20px;display:flex;align-items:center;cursor:pointer;position:relative;margin-bottom:6px}
#progBg{width:100%;height:4px;background:rgba(255,255,255,.3);border-radius:99px}
#progFill{height:100%;width:0%;background:#7c3aed;border-radius:99px}
#ctrlRow{display:flex;justify-content:space-between;align-items:center;margin-top:4px;flex-wrap:nowrap}
.cLeft,.cRight{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.cBtn{background:transparent;border:0;color:#fff;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:.2s;flex-shrink:0}
.cBtn:hover{background:rgba(255,255,255,.14)}
.cBtn svg{width:22px;height:22px;fill:#fff}
#time{color:#e8e8e8;font-size:11px;font-weight:600;white-space:nowrap}
#marcaPill{color:#fff;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(124,58,237,.12));border:1px solid rgba(124,58,237,.38);padding:5px 10px;border-radius:20px;white-space:nowrap}
#volWrap{position:relative;display:flex;align-items:center}
#volPopup{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);background:#1a1a28;border:1px solid #2a2a4a;border-radius:14px;padding:14px 12px;display:none;flex-direction:column;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:99}

#volSlider{writing-mode:bt-lr;-webkit-appearance:slider-vertical;width:6px;height:90px;background:rgba(255,255,255,.2);border-radius:99px;outline:none;appearance:slider-vertical}
#volValue{color:#fff;font-size:10px;font-weight:800}
#lockBtn{position:absolute;top:50%;left:12px;transform:translateY(-50%);z-index:96;width:38px;height:38px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);transition:.3s}
#lockBtn.show{display:flex}
#lockBtn svg{width:18px;height:18px;fill:#fff}
#wrap.locked #lockBtn{display:flex!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:84px;height:84px;background:rgba(20,20,20,.9)!important;z-index:300!important;pointer-events:all!important;border:2px solid rgba(255,255,255,.35)!important;box-shadow:0 8px 32px rgba(0,0,0,.8)!important}
#lockHint{position:absolute;top:calc(50% + 62px);left:50%;transform:translateX(-50%);z-index:301;color:#fff;background:rgba(0,0,0,.8);padding:7px 16px;border-radius:20px;font-size:11px;font-weight:700;display:none;white-space:nowrap;pointer-events:none}
#wrap.locked #lockHint{display:block}
#epiBtn{display:none}
#epiBtn.show{display:flex}
#epiDrawer{position:absolute;top:0;right:0;bottom:0;width:340px;z-index:110;background:#0f0f17;border-left:1px solid #23233a;transform:translateX(100%);transition:.35s;display:flex;flex-direction:column}
#epiDrawer.show{transform:translateX(0)}
#epiHead{padding:16px 18px;border-bottom:1px solid #23233a;display:flex;justify-content:space-between;align-items:center}
#epiHead b{color:#fff;font-size:13px}
#epiList{overflow-y:auto;flex:1;padding:8px}
.epiItem{padding:10px 12px;border-radius:10px;display:flex;gap:10px;cursor:pointer;margin-bottom:4px}
.epiItem:hover{background:#1a1a2a}

.epiItem.active .epiNum{background:rgba(255,255,255,.2);color:#fff}
.epiInfo b{color:#fff;font-size:12px;display:block;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epiInfo small{color:#888;font-size:10px}
#nextOverlay{position:absolute;bottom:84px;right:20px;z-index:80;background:#181828;border:1px solid #2a2a4a;border-radius:16px;padding:14px 16px;width:300px;display:none;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.7)}
#nextOverlay.show{display:flex}
#nextBar{width:100%;height:3px;background:rgba(255,255,255,.15);border-radius:10px;margin-top:12px;overflow:hidden}
#nextFill{height:100%;width:0%;background:#7c3aed;transition:width 1s linear}
#nextActions{display:flex;gap:8px;margin-top:12px}
.btnNext{flex:1;border:0;padding:8px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer}
.btnNext.primary{background:#fff;color:#000}
.btnNext.secondary{background:rgba(255,255,255,.12);color:#fff}
#resumeOverlay{position:absolute;inset:0;z-index:81;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column}
#resumeOverlay.show{display:flex}
#serverMenu{position:absolute;bottom:64px;right:12px;z-index:98;background:#14141f;border:1px solid #2a2a4a;border-radius:14px;padding:8px;min-width:220px;box-shadow:0 12px 32px rgba(0,0,0,.6);display:none;max-height:420px;overflow:auto}
#serverMenu.show{display:block}
.qOpt{width:100%;text-align:left;background:transparent;border:0;color:#a5a5c5;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between}
.qOpt.active{background:#7c3aed;color:#fff}
.menuTitle{color:#666;font-size:9px;font-weight:800;letter-spacing:1px;padding:10px 12px 4px 12px;border-top:1px solid #1e1e3a;margin-top:6px}
#loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:70;display:none}
.spinner{width:46px;height:46px;border:3px solid rgba(255,255,255,.12);border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#touchLeft,#touchCenter,#touchRight{position:absolute;top:0;bottom:0;z-index:55}
#touchLeft{left:0;width:30%}
#touchRight{right:0;width:30%}
#touchCenter{left:30%;width:40%}
#fsBtn{background:rgba(255,255,255,.14)!important;border-radius:10px!important;border:1px solid rgba(255,255,255,.18)!important}
@media (max-width:768px) and (orientation:portrait){
 #wrap{height:100dvh}
 #video,#player{object-fit:contain}
 #bottom{padding:10px 10px calc(20px + env(safe-area-inset-bottom,0)) 10px}
 #ctrlRow{gap:4px}
 .cLeft{gap:4px}
 .cRight{gap:4px}
 .cRight .cBtn.hide-m{display:none}
 #marcaPill{display:none}
 #time{font-size:10px}
 #topBar{padding:10px 12px}
 #centerTitle{font-size:18px;padding:0 12px}
 #skipControls{gap:14px}
 .skipBtn{width:54px;height:54px}
 #playPauseCenter{width:60px;height:60px}
 #lockBtn{left:10px;width:36px;height:36px}
 #modeBadge{top:54px;left:10px;font-size:8px}
}
@media (max-width:768px) and (orientation:landscape){
 #bottom{padding:6px 12px 10px 12px}
 #video{object-fit:contain}
}
</style>
</head>

<script>
function g(n){let m=location.href.match(new RegExp('[?&]'+n+'=([^&]+)'));if(!m)return null;let v=decodeURIComponent(m[1]);try{if(v.length>60&&!v.includes('http'))v=atob(v)}catch(e){}try{v=decodeURIComponent(v)}catch(e){}return v}
function fromBase64Unicode(b64){try{return decodeURIComponent(escape(atob(b64)))}catch(e){return atob(b64)}}
let servers=[];['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10'].forEach(k=>{let v=g(k);if(v)servers.push(v)})
let titulo=g('titulo')||'',poster=g('poster'),year=g('year')||'2015',marca=(g('marca')||'XONAPLAY').toUpperCase(),t=g('t'),e=g('e'),tipo=g('tipo'),epsRaw=g('eps')
let decTitle=decodeURIComponent(titulo||'')
let isSeries=false
if(tipo&&tipo.toLowerCase().includes('serie'))isSeries=true
if(epsRaw)isSeries=true
if(t&&e)isSeries=true
document.getElementById('titleTxt').innerText=decTitle
document.getElementById('centerTitle').innerText=decTitle
document.getElementById('logoSpan').innerText=marca
document.getElementById('marcaPill').innerText=marca
document.getElementById('centerSub').innerText='Toca para reproducir • '+marca
document.getElementById('modeBadge').innerText=isSeries?'MODO SERIE':'MODO PELÍCULA'
if(isSeries)document.getElementById('epiBtn').classList.add('show')
if(t&&e)document.getElementById('subTxt').innerText=`T${t} • E${e} • ${year}`;else document.getElementById('subTxt').innerText=year+' • HD'
if(poster){try{let p=decodeURIComponent(poster);if(p.startsWith('http')){document.getElementById('bgPoster').style.backgroundImage=`url('${p}')`}}catch(e){}}
const topBar=document.getElementById('topBar'),bottom=document.getElementById('bottom'),iframe=document.getElementById('player'),video=document.getElementById('video'),center=document.getElementById('center'),loader=document.getElementById('loader'),progFill=document.getElementById('progFill'),timeEl=document.getElementById('time'),ppBtn=document.getElementById('ppBtn'),wrap=document.getElementById('wrap'),skipControls=document.getElementById('skipControls'),ppCenterIcon=document.getElementById('ppCenterIcon'),serverMenu=document.getElementById('serverMenu'),progWrap=document.getElementById('progWrap'),epiDrawer=document.getElementById('epiDrawer'),epiList=document.getElementById('epiList'),nextOverlay=document.getElementById('nextOverlay'),resumeOverlay=document.getElementById('resumeOverlay'),lockBtn=document.getElementById('lockBtn'),seekFeedback=document.getElementById('seekFeedback'),seekAnimLeft=document.getElementById('seekAnimLeft'),seekAnimRight=document.getElementById('seekAnimRight'),volPopup=document.getElementById('volPopup'),volSlider=document.getElementById('volSlider'),volValue=document.getElementById('volValue'),volBtn=document.getElementById('volBtn')
let hls=null,cur=0,started=false,hideT=null,countInt=null,currentQuality=-1,pendingTime=0,resumeKey='',resumeTime=0,isLocked=false,lastTap=0,lastTapX=0,seekFbT=null
let episodes=[]
try{if(epsRaw){let jsonStr=fromBase64Unicode(epsRaw);episodes=JSON.parse(jsonStr)}}catch(e){try{episodes=JSON.parse(atob(epsRaw))}catch(e2){episodes=[]}}
if(isSeries && episodes.length===0 && servers.length>1){episodes=servers.map((u,i)=>({n:i+1,t:`Episodio ${i+1}`,url:u,d:'24 min'}))}
function isMedia(u){return u.toLowerCase().includes('.m3u8')||u.toLowerCase().includes('.mp4')||u.toLowerCase().includes('.webm')}
function getResumeKey(url){return 'xona_resume_'+btoa(url).slice(0,40)+'_'+btoa(decTitle).slice(0,20)}
function showLoad(b){loader.style.display=b?'block':'none'}
function play(url){
 showLoad(true);if(hls){try{hls.destroy()}catch(e){}} hls=null;currentQuality=-1
 center.classList.add('hide');document.getElementById('bgPoster').style.opacity='0';document.getElementById('bgGradient').style.opacity='0'
 bottom.classList.remove('hide')
 resumeKey=getResumeKey(url);resumeTime=parseFloat(localStorage.getItem(resumeKey)||0)
 if(resumeTime>15 && !isNaN(resumeTime)){document.getElementById('resumeDesc').innerText=`Te quedaste en ${fmt(resumeTime)} - ¿Quieres continuar?`;resumeOverlay.classList.add('show');pendingTime=resumeTime}else{pendingTime=0}
 if(isMedia(url)){
  iframe.style.display='none';video.style.display='block';
  video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');
  if(url.toLowerCase().includes('.m3u8')){
   if(Hls.isSupported()){
    hls=new Hls({autoStartLoad:true, enableWorker:true});
    hls.loadSource(url);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{showLoad(false);video.play().catch(()=>{});});
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)showLoad(false)})
   }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;
    video.addEventListener('loadedmetadata',()=>{showLoad(false);video.play().catch(()=>{});},{once:true});
   }
  }else{
   video.src=url;video.oncanplay=()=>{showLoad(false);if(pendingTime==0)video.play().catch(()=>{});};
  }
 }else{video.pause();video.style.display='none';iframe.style.display='block';iframe.src=url;setTimeout(()=>showLoad(false),1000)}
}
function fmt(s){let m=Math.floor(s/60).toString().padStart(2,'0'),sc=Math.floor(s%60).toString().padStart(2,'0');return `${m}:${sc}`}
function resumeYes(){resumeOverlay.classList.remove('show');if(pendingTime){video.currentTime=pendingTime;video.play()} pendingTime=0}
function resumeNo(){resumeOverlay.classList.remove('show');localStorage.removeItem(resumeKey);pendingTime=0;video.currentTime=0;video.play()}
function start(){if(!servers.length && !episodes.length)return;started=true;let u=episodes.length?episodes[cur].url:servers[cur];play(u);ui();if(isSeries)buildEpiList()}
function seekBy(d){if(isLocked)return;if(video.duration){video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+d));ui();showSeekFb(d)}}
function showSeekFb(d){clearTimeout(seekFbT);seekFeedback.classList.add('show');seekAnimLeft.style.display=d<0?'flex':'none';seekAnimRight.style.display=d>0?'flex':'none';seekFbT=setTimeout(()=>seekFeedback.classList.remove('show'),700)}
function toggle(){if(isLocked)return;if(video.style.display==='block'){if(video.paused)video.play();else video.pause()}}
function toggleFS(){if(!document.fullscreenElement){wrap.requestFullscreen().catch(()=>{if(video.requestFullscreen)video.requestFullscreen()})}else document.exitFullscreen()}
async function togglePiP(){try{if(document.pictureInPictureElement){await document.exitPictureInPicture()}else{if(video.readyState>0)await video.requestPictureInPicture()}}catch(e){}}
async function toggleCast(){try{if(video.remote){await video.remote.prompt()}else{alert('Chromecast: misma WiFi')}}catch(e){}}
function toggleSpeed(s){video.playbackRate=s;serverMenu.classList.remove('show')}
function setQuality(h){if(!hls)return;if(h==='auto'){hls.currentLevel=-1;currentQuality=-1;serverMenu.classList.remove('show');return}let best=-1,bestH=0;for(let i=0;i<hls.levels.length;i++){let hh=hls.levels[i].height||0;if(hh<=h && hh>bestH){bestH=hh;best=i}}if(best==-1){let closest=0,min=9999;for(let i=0;i<hls.levels.length;i++){let d=Math.abs((hls.levels[i].height||0)-h);if(d<min){min=d;closest=i}}best=closest}hls.currentLevel=best;currentQuality=best;serverMenu.classList.remove('show')}
function toggleMenu(){if(serverMenu.classList.contains('show')){serverMenu.classList.remove('show');return}let html='';if(hls && hls.levels && hls.levels.length>0){let levels=[...hls.levels].sort((a,b)=>b.height-a.height);let uniq=[...new Set(levels.map(l=>l.height))].sort((a,b)=>b-a);html+='<div class="menuTitle">CALIDAD REAL</div>';html+=`<button class="qOpt ${currentQuality==-1?'active':''}" onclick="setQuality('auto')"><span>Auto</span><span>${currentQuality==-1?'●':''}</span></button>`;uniq.forEach(hh=>{let active=hls.levels[currentQuality]?.height==hh;html+=`<button class="qOpt ${active?'active':''}" onclick="setQuality(${hh})"><span>${hh}p</span><span>${active?'●':''}</span></button>`})}html+='<div class="menuTitle">VELOCIDAD</div>';[0.5,0.75,1,1.25,1.5,1.75,2].forEach(sp=>{let act=video.playbackRate==sp;html+=`<button class="qOpt ${act?'active':''}" onclick="toggleSpeed(${sp})"><span>${sp}x</span><span>${act?'●':''}</span></button>`});serverMenu.innerHTML=html;serverMenu.classList.add('show')}
function toggleEpi(){if(isLocked)return;epiDrawer.classList.toggle('show')}
const lockedIcon = '<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="#fff"/></svg>';
const unlockedIcon = '<svg viewBox="0 0 24 24"><path d="M12 17a2 2 0 0 0 2-2a2 2 0 0 0-2-2a2 2 0 0 0-2 2a2 2 0 0 0 2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 5-5a5 5 0 0 1 5 5v2h1m-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3Z" fill="#fff"/></svg>';
function setLockIcon(){lockBtn.innerHTML = isLocked ? unlockedIcon : lockedIcon;}
setLockIcon();
function toggleLock(){
 isLocked=!isLocked;setLockIcon();
 if(isLocked){wrap.classList.add('locked');lockBtn.classList.add('show');volPopup.classList.remove('show');serverMenu.classList.remove('show');epiDrawer.classList.remove('show');topBar.classList.add('hide');bottom.classList.add('hide');skipControls.classList.remove('show');}
 else{wrap.classList.remove('locked');lockBtn.classList.remove('show');ui();}
}
function toggleVol(){if(isLocked)return;volPopup.classList.toggle('show')}
volSlider.addEventListener('input',(e)=>{let v=e.target.value;video.volume=v/100;video.muted=false;volValue.innerText=v+'%';})
function seek(ev){if(!video.duration||isLocked)return;let r=ev.currentTarget.getBoundingClientRect();let p=(ev.clientX-r.left)/r.width;video.currentTime=p*video.duration}
progWrap.addEventListener('click',seek)
video.addEventListener('timeupdate',()=>{if(!video.duration)return;let pc=(video.currentTime/video.duration)*100;progFill.style.width=pc+'%';let cm=Math.floor(video.currentTime/60).toString().padStart(2,'0'),cs=Math.floor(video.currentTime%60).toString().padStart(2,'0'),dm=Math.floor(video.duration/60).toString().padStart(2,'0'),ds=Math.floor(video.duration%60).toString().padStart(2,'0');timeEl.innerText=`${cm}:${cs} / ${dm}:${ds}`;if(video.currentTime>10 && video.currentTime < video.duration-20 && Math.floor(video.currentTime)%5==0){if(resumeKey) localStorage.setItem(resumeKey, video.currentTime)}})
video.addEventListener('play',()=>{ppBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';ppCenterIcon.innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';skipControls.classList.remove('show');ui()})
video.addEventListener('pause',()=>{ppBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>';ppCenterIcon.innerHTML='<path d="M8 5.14v14l11-7-11-7z"/>';skipControls.classList.add('show');ui()})
video.addEventListener('ended',()=>{if(resumeKey)localStorage.removeItem(resumeKey);if(isSeries)autoNext()})
function buildEpiList(){epiList.innerHTML='';episodes.forEach((ep,idx)=>{let div=document.createElement('div');div.className='epiItem'+(idx==cur?' active':'');div.innerHTML=`<div class="epiNum">${ep.n}</div><div class="epiInfo"><b>${ep.t}</b><small>${ep.d||'24 min'}</small></div>`;div.onclick=()=>{cur=idx;play(ep.url);document.querySelectorAll('.epiItem').forEach(x=>x.classList.remove('active'));div.classList.add('active');epiDrawer.classList.remove('show')};epiList.appendChild(div)})}
function autoNext(){if(cur>=episodes.length-1 && cur>=servers.length-1)return;nextOverlay.classList.add('show');let nextEpObj=episodes[cur+1]||{t:`Episodio ${cur+2}`};document.getElementById('nextName').innerText=nextEpObj.t;let total=15;let c=total;document.getElementById('count').innerText=c;document.getElementById('nextFill').style.width='0%';countInt=setInterval(()=>{c--;document.getElementById('count').innerText=c;document.getElementById('nextFill').style.width=((total-c)/total*100)+'%';if(c<=0){playNextNow()}},1000)}
function playNextNow(){clearInterval(countInt);nextOverlay.classList.remove('show');cur++;let u=episodes.length?episodes[cur]?.url:servers[cur];if(u)play(u);buildEpiList()}
function cancelNext(){clearInterval(countInt);nextOverlay.classList.remove('show')}
function ui(){if(isLocked)return;wrap.classList.add('show');topBar.classList.remove('hide');bottom.classList.remove('hide');lockBtn.classList.add('show');if(started){if(!video.paused){skipControls.classList.remove('show')}else{skipControls.classList.add('show')}}clearTimeout(hideT);if(started&&!video.paused){hideT=setTimeout(()=>{topBar.classList.add('hide');bottom.classList.add('hide');wrap.classList.remove('show');serverMenu.classList.remove('show');skipControls.classList.remove('show');lockBtn.classList.remove('show');volPopup.classList.remove('show')},3500)}}
function handleDoubleTap(x){let now=Date.now();let diff=now-lastTap;if(diff<400 && Math.abs(x-lastTapX)<80){let zone = x < window.innerWidth*0.35 ? 'left' : x > window.innerWidth*0.65 ? 'right' : 'center';if(zone==='left') seekBy(-10);else if(zone==='right') seekBy(10);else toggle();lastTap=0}else{lastTap=now;lastTapX=x;setTimeout(()=>{if(Date.now()-lastTap>=380){ui()}},400)}}
wrap.addEventListener('touchend',(e)=>{if(e.target.closest('#lockBtn'))return;if(e.target.closest('button')||e.target.closest('#bottom')||e.target.closest('#topBar'))return;let x=e.changedTouches[0].clientX;handleDoubleTap(x)})
document.getElementById('touchLeft').addEventListener('click',()=>{if(!isLocked)seekBy(-10)})
document.getElementById('touchRight').addEventListener('click',()=>{if(!isLocked)seekBy(10)})
document.getElementById('touchCenter').addEventListener('click',()=>{if(!isLocked)toggle();ui()})
wrap.addEventListener('mousemove',ui)
wrap.addEventListener('click',(e)=>{if(e.target.closest('.skipBtn')||e.target.closest('#playPauseCenter')||e.target.closest('#volWrap'))return;if(e.target.closest('#lockBtn')){toggleLock();return}ui()})
document.addEventListener('keydown',(e)=>{if(e.code==='Escape' && isLocked){toggleLock();return}if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowLeft')seekBy(-10);if(e.code==='ArrowRight')seekBy(10);if(e.code==='KeyL')toggleLock();})
</script>
</body>
</html>
